<!DOCTYPE html>
<html lang="tr" class="no-js">
<head>
<meta charset="UTF-8">
<script>document.documentElement.classList.remove('no-js');document.documentElement.classList.add('js');try{if(localStorage.getItem('arti10_theme')==='dark')document.documentElement.classList.add('dark');}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b38">
<title>Admin · Kurslar · Artı 10</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3"><link rel="stylesheet" href="app.css?v=3">
</head>
<body class="admin">
<div class="nojs-warn"><h2>JavaScript gerekli</h2></div>
<div class="admin-layout" id="layout">
  <main class="admin-main">
    <div id="atop"></div>
    <div class="admin-body" id="body" hidden>
      <div class="panel">
        <div class="panel-head"><div><h2>Kurslar</h2><div class="ph-sub" id="cCount"></div></div><button class="btn btn-gold btn-sm" id="addBtn">+ Yeni Kurs</button></div>
        <div class="atable-wrap"><table class="atable"><thead><tr><th>Kurs</th><th>Kategori</th><th>Seviye</th><th>Ders</th><th></th></tr></thead><tbody id="cBody"></tbody></table></div>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="modal">
  <div class="mscrim" data-close></div>
  <div class="mbox">
    <div class="mhead"><h3 id="mTitle">Yeni Kurs</h3><button class="mclose" data-close>✕</button></div>
    <div class="mbody">
      <input type="hidden" id="fId">
      <div class="field"><label for="fTitle">Kurs adı</label><input class="inp" id="fTitle" placeholder="Örn. Teknik Analiz Eğitimi"></div>
      <div class="field row2">
        <div class="field" style="margin:0"><label for="fCat">Kategori</label><input class="inp" id="fCat" placeholder="Analiz"></div>
        <div class="field" style="margin:0"><label for="fLevel">Seviye</label>
          <select class="inp" id="fLevel"><option>Tüm seviyeler</option><option>Başlangıç</option><option>Orta</option><option>İleri</option></select></div>
      </div>
      <div class="field row2">
        <div class="field" style="margin:0"><label for="fIcon">İkon</label>
          <select class="inp" id="fIcon"><option value="chart">Grafik</option><option value="building">Bina</option><option value="globe">Küre</option><option value="coin">Kripto</option><option value="brain">Psikoloji</option><option value="flow">İşlem</option><option value="grid">Sistem</option></select></div>
        <div class="field" style="margin:0"><label for="fAccent">Renk</label><input class="inp" type="color" id="fAccent" value="#2b4f86" style="padding:6px;height:46px"></div>
      </div>
      <div class="field"><label for="fDesc">Açıklama</label><textarea class="inp" id="fDesc" placeholder="Kursun kısa açıklaması"></textarea></div>
      <div class="alert err" id="mAlert"></div>
    </div>
    <div class="mfoot"><button class="btn btn-ghost" data-close>Vazgeç</button><button class="btn btn-gold" id="saveBtn">Kaydet</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="auth.js"></script>
<script src="app-shell.js"></script>
<script>
(function(){
  if(!Auth.requireAdmin()) return;
  var S=Shell, $=function(s){return document.querySelector(s)};
  $("#layout").insertAdjacentHTML("afterbegin",S.adminShell("kurslar"));
  $("#atop").innerHTML=S.adminTop("Kurslar");
  S.wire(); $("#body").hidden=false;
  function esc(s){return (s||"").replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function toast(m){var t=$("#toast");t.innerHTML=S.svg('check')+m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2200);}
  var trash='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
  var edit='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';

  function render(){
    var courses=DB.courses();
    $("#cCount").textContent=courses.length+" kurs · "+DB.stats().lessons+" ders";
    $("#cBody").innerHTML=courses.map(function(c){
      return '<tr><td><div class="cellflex"><span class="t-av" style="background:linear-gradient(140deg,'+c.accent+',#0c1730);border-radius:9px">'+S.svg(c.icon)+'</span><div><div class="t-title">'+esc(c.title)+'</div><div class="t-sub">'+esc(c.desc).slice(0,52)+'…</div></div></div></td>'+
        '<td>'+esc(c.cat)+'</td><td class="t-sub">'+esc(c.level)+'</td><td><span class="tag-count">'+c.lessons.length+' ders</span></td>'+
        '<td><div class="rowacts"><a class="iconbtn" href="admin-kurs.html?id='+c.id+'" title="Düzenle">'+edit+'</a><button class="iconbtn danger" data-del="'+c.id+'" title="Sil">'+trash+'</button></div></td></tr>';
    }).join("");
  }
  render();

  var modal=$("#modal");
  function openModal(c){
    $("#mAlert").className="alert err";
    $("#mTitle").textContent=c?"Kursu Düzenle":"Yeni Kurs";
    $("#fId").value=c?c.id:""; $("#fTitle").value=c?c.title:""; $("#fCat").value=c?c.cat:"Analiz";
    $("#fLevel").value=c?c.level:"Tüm seviyeler"; $("#fIcon").value=c?c.icon:"chart"; $("#fAccent").value=c?c.accent:"#2b4f86"; $("#fDesc").value=c?c.desc:"";
    modal.classList.add("open");
  }
  function closeModal(){modal.classList.remove("open")}
  $("#addBtn").addEventListener("click",function(){openModal(null)});
  modal.addEventListener("click",function(e){if(e.target.closest("[data-close]"))closeModal()});
  $("#saveBtn").addEventListener("click",function(){
    var title=$("#fTitle").value.trim();
    if(title.length<3){$("#mAlert").className="alert err show";$("#mAlert").textContent="Kurs adı en az 3 karakter olmalı.";return;}
    var data={title:title,cat:$("#fCat").value.trim()||"Genel",level:$("#fLevel").value,icon:$("#fIcon").value,accent:$("#fAccent").value,desc:$("#fDesc").value.trim()};
    var id=$("#fId").value;
    if(id){ DB.updateCourse(id,data); toast("Kurs güncellendi"); }
    else { var c=DB.addCourse(data); toast("Kurs eklendi"); closeModal(); location.href="admin-kurs.html?id="+c.id; return; }
    closeModal(); render();
  });

  $("#cBody").addEventListener("click",function(e){
    var d=e.target.closest("[data-del]"); if(d){ var c=DB.course(d.getAttribute("data-del")); if(confirm('"'+c.title+'" kursu ve tüm dersleri silinsin mi?')){ DB.removeCourse(c.id); render(); toast("Kurs silindi"); } }
  });
})();
</script>
</body>
</html>
