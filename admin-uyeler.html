<!DOCTYPE html>
<html lang="tr" class="no-js">
<head>
<meta charset="UTF-8">
<script>document.documentElement.classList.remove('no-js');document.documentElement.classList.add('js');try{if(localStorage.getItem('arti10_theme')==='dark')document.documentElement.classList.add('dark');}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b38">
<title>Admin · Üyeler · Artı 10</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5"><link rel="stylesheet" href="app.css?v=5">
</head>
<body class="admin">
<div class="nojs-warn"><h2>JavaScript gerekli</h2></div>
<div class="admin-layout" id="layout">
  <main class="admin-main">
    <div id="atop"></div>
    <div class="admin-body" id="body" hidden>
      <div class="panel">
        <div class="panel-head"><div><h2>Üyeler</h2><div class="ph-sub" id="uCount"></div></div>
          <input class="inp" id="search" placeholder="Ara: ad veya e-posta" style="max-width:240px;margin:0"></div>
        <div class="atable-wrap"><table class="atable"><thead><tr><th>Üye</th><th>Rol</th><th>Paket</th><th>Tarih</th><th></th></tr></thead><tbody id="uBody"></tbody></table></div>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="modal">
  <div class="mscrim" data-close></div>
  <div class="mbox">
    <div class="mhead"><h3>Üyeyi Düzenle</h3><button class="mclose" data-close>✕</button></div>
    <div class="mbody">
      <input type="hidden" id="uId">
      <div class="field"><label>Ad Soyad</label><input class="inp" id="uName"></div>
      <div class="field"><label>E-posta</label><input class="inp" type="email" id="uEmail"></div>
      <div class="field row2">
        <div class="field" style="margin:0"><label>Rol</label><select class="inp" id="uRole"><option value="member">Üye</option><option value="admin">Yönetici</option></select></div>
        <div class="field" style="margin:0"><label>Abonelik dönemi</label><select class="inp" id="uPeriod"><option value="monthly">Aylık</option><option value="annual">Yıllık</option></select></div>
      </div>
      <div class="field"><label>Paket (abonelik)</label><select class="inp" id="uPkg"></select><span class="hint">Paket atamak kullanıcıya o paketteki tüm kurslara erişim verir. "Paket yok" erişimi kaldırır.</span></div>
      <div class="field"><label>Ek kurs erişimi (manuel hediye)</label><div id="grantList" style="display:grid;gap:8px;margin-top:4px"></div><span class="hint">Pakete ek olarak tek tek kurs erişimi vermek istersen işaretle.</span></div>
      <div class="alert err" id="mAlert"></div>
    </div>
    <div class="mfoot"><button class="btn btn-ghost" id="delUser" style="margin-right:auto;color:#c0476a;box-shadow:inset 0 0 0 1.5px #f0c4cf">Üyeyi Sil</button><button class="btn btn-ghost" data-close>Vazgeç</button><button class="btn btn-gold" id="saveUser">Kaydet</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="auth.js"></script>
<script src="app-shell.js"></script>
<script>
(function(){
  if(!Auth.requireAdmin()) return;
  var S=Shell, me=Auth.current(), $=function(s){return document.querySelector(s)};
  $("#layout").insertAdjacentHTML("afterbegin",S.adminShell("uyeler"));
  $("#atop").innerHTML=S.adminTop("Üyeler");
  S.wire(); $("#body").hidden=false;
  function esc(s){return (s||"").replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function toast(m){var t=$("#toast");t.innerHTML=S.svg('check')+m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2000);}
  var edit='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';

  function render(filter){
    var users=DB.users();
    if(filter){ filter=filter.toLowerCase(); users=users.filter(function(u){return (u.name+u.email).toLowerCase().indexOf(filter)>=0}); }
    $("#uCount").textContent=DB.users().length+" üye · "+DB.stats().subscribers+" aktif abone";
    $("#uBody").innerHTML=users.map(function(u){
      var pkg=DB.packageOf(u.id);
      return '<tr><td><div class="cellflex"><span class="t-av">'+S.initials(u)+'</span><div><div class="t-title">'+esc(u.name)+(u.id===me.id?' <span class="t-sub">(sen)</span>':'')+'</div><div class="t-sub">'+esc(u.email)+'</div></div></div></td>'+
        '<td><span class="pill-role '+u.role+'">'+(u.role==="admin"?"Yönetici":"Üye")+'</span></td>'+
        '<td>'+(pkg?'<span class="pill-role member">'+esc(pkg.name)+'</span>':'<span class="t-sub">Paket yok</span>')+'</td><td class="t-sub">'+esc(u.createdAt)+'</td>'+
        '<td><div class="rowacts"><button class="iconbtn" data-edit="'+u.id+'">'+edit+'</button></div></td></tr>';
    }).join("") || '<tr><td colspan="5" class="muted" style="text-align:center;padding:30px">Sonuç yok.</td></tr>';
  }
  render("");
  $("#search").addEventListener("input",function(){render(this.value)});

  var modal=$("#modal");
  function openUser(u){
    $("#mAlert").className="alert err";
    $("#uId").value=u.id; $("#uName").value=u.name; $("#uEmail").value=u.email; $("#uRole").value=u.role;
    var sub=DB.subscription(u.id);
    $("#uPkg").innerHTML='<option value="">Paket yok</option>'+DB.packages().map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+' (₺'+p.priceMonthly+'/ay)</option>';}).join("");
    $("#uPkg").value=sub?sub.packageId:"";
    $("#uPeriod").value=sub?sub.period:"monthly";
    $("#grantList").innerHTML=DB.courses().map(function(c){
      var on=(u.grants||[]).indexOf(c.id)>=0;
      return '<label style="display:flex;align-items:center;gap:9px;font-size:.9rem;cursor:pointer"><input type="checkbox" value="'+c.id+'" '+(on?'checked':'')+'> '+esc(c.title)+'</label>';
    }).join("");
    $("#delUser").style.display=u.id===me.id?"none":"";
    modal.classList.add("open");
  }
  modal.addEventListener("click",function(e){if(e.target.closest("[data-close]"))modal.classList.remove("open")});
  $("#uBody").addEventListener("click",function(e){var b=e.target.closest("[data-edit]");if(b)openUser(DB.user(b.getAttribute("data-edit")))});
  $("#saveUser").addEventListener("click",function(){
    var id=$("#uId").value, email=$("#uEmail").value.trim().toLowerCase();
    var ex=DB.userByEmail(email); if(ex&&ex.id!==id){$("#mAlert").className="alert err show";$("#mAlert").textContent="Bu e-posta başka üyede kullanılıyor.";return;}
    var grants=Array.prototype.slice.call($("#grantList").querySelectorAll("input:checked")).map(function(i){return i.value});
    DB.updateUser(id,{name:$("#uName").value.trim(),email:email,role:$("#uRole").value,grants:grants});
    DB.setUserPackage(id, $("#uPkg").value, $("#uPeriod").value);
    modal.classList.remove("open"); render($("#search").value); toast("Üye güncellendi");
  });
  $("#delUser").addEventListener("click",function(){
    var id=$("#uId").value, u=DB.user(id);
    if(id===me.id) return;
    if(confirm('"'+u.name+'" üyesi silinsin mi?')){ DB.removeUser(id); modal.classList.remove("open"); render($("#search").value); toast("Üye silindi"); }
  });
})();
</script>
</body>
</html>
