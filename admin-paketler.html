<!DOCTYPE html>
<html lang="tr" class="no-js">
<head>
<meta charset="UTF-8">
<script>document.documentElement.classList.remove('no-js');document.documentElement.classList.add('js');try{if(localStorage.getItem('arti10_theme')==='dark')document.documentElement.classList.add('dark');}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b38">
<title>Admin · Paketler · Artı 10</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6"><link rel="stylesheet" href="app.css?v=6">
</head>
<body class="admin">
<div class="nojs-warn"><h2>JavaScript gerekli</h2></div>
<div class="admin-layout" id="layout">
  <main class="admin-main">
    <div id="atop"></div>
    <div class="admin-body" id="body" hidden>
      <div class="panel">
        <div class="panel-head"><div><h2>Abonelik Paketleri</h2><div class="ph-sub" id="pCount"></div></div><button class="btn btn-gold btn-sm" id="addBtn">+ Yeni Paket</button></div>
        <div class="atable-wrap"><table class="atable"><thead><tr><th>Paket</th><th>Aylık</th><th>Yıllık (ay)</th><th>İçerik</th><th></th></tr></thead><tbody id="pBody"></tbody></table></div>
      </div>
      <p class="muted" style="font-size:.85rem">İpucu: Fiyatlar müşteriyle pazarlığa açık; buradan istediğin zaman değiştir. En üst paket "Tüm kurslar"ı içermeli; aksi halde en değerli kurs (Özel Analiz Sistemleri) hiçbir pakette açık olmaz.</p>
    </div>
  </main>
</div>

<div class="modal" id="modal">
  <div class="mscrim" data-close></div>
  <div class="mbox">
    <div class="mhead"><h3 id="mTitle">Paket</h3><button class="mclose" data-close>✕</button></div>
    <div class="mbody">
      <input type="hidden" id="fId">
      <div class="field"><label>Paket adı</label><input class="inp" id="fName" placeholder="Örn. Yatırımcı"></div>
      <div class="field"><label>Slogan</label><input class="inp" id="fTag" placeholder="Kısa açıklama"></div>
      <div class="field row2">
        <div class="field" style="margin:0"><label>Aylık fiyat (₺)</label><input class="inp" type="number" id="fPm" min="0"></div>
        <div class="field" style="margin:0"><label>Yıllık fiyat (aylık eşdeğer, ₺)</label><input class="inp" type="number" id="fPa" min="0"></div>
      </div>
      <div class="field row2">
        <div class="field" style="margin:0"><label>Vurgu rengi</label><input class="inp" type="color" id="fAccent" style="padding:6px;height:46px"></div>
        <div class="field" style="margin:0;justify-content:flex-end"><label style="display:flex;align-items:center;gap:9px;cursor:pointer;margin-top:8px"><input type="checkbox" id="fPopular"> "En popüler" olarak işaretle</label></div>
      </div>
      <div class="field"><label>İçerdiği kurslar</label>
        <label style="display:flex;align-items:center;gap:9px;font-weight:700;cursor:pointer;margin:4px 0 8px"><input type="checkbox" id="fAll"> Tüm kurslar (gelecekte eklenenler dahil)</label>
        <div id="courseList" style="display:grid;gap:8px"></div>
      </div>
      <div class="field"><label>Avantajlar (her satıra bir madde)</label><textarea class="inp" id="fPerks" style="min-height:120px"></textarea></div>
      <div class="alert err" id="mAlert"></div>
    </div>
    <div class="mfoot"><button class="btn btn-ghost" data-close>Vazgeç</button><button class="btn btn-gold" id="saveBtn">Kaydet</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="auth.js"></script>
<script src="app-shell.js"></script>
<script>
(function(){
  if(!Auth.requireAdmin()) return;
  var S=Shell, $=function(s){return document.querySelector(s)};
  $("#layout").insertAdjacentHTML("afterbegin",S.adminShell("paketler"));
  $("#atop").innerHTML=S.adminTop("Paketler");
  S.wire(); $("#body").hidden=false;
  function esc(s){return (s||"").replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function toast(m){var t=$("#toast");t.innerHTML=S.svg('check')+m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2000);}
  var trash='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
  var edit='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
  var nCourses=DB.courses().length;

  function render(){
    var pkgs=DB.packages();
    $("#pCount").textContent=pkgs.length+" paket";
    $("#pBody").innerHTML=pkgs.map(function(p){
      var inc=p.includedCourses.indexOf("all")>=0?("Tüm kurslar ("+nCourses+")"):(p.includedCourses.length+" kurs");
      return '<tr><td><div class="cellflex"><span class="t-av" style="background:'+p.accent+';border-radius:9px">'+S.svg('crown')+'</span><div><div class="t-title">'+esc(p.name)+(p.popular?' <span class="pill-role member" style="font-size:.62rem">POPÜLER</span>':'')+'</div><div class="t-sub">'+esc(p.tagline)+'</div></div></div></td>'+
        '<td><b>₺'+p.priceMonthly+'</b></td><td class="t-sub">₺'+p.priceAnnualMonthly+'</td><td><span class="tag-count">'+inc+'</span></td>'+
        '<td><div class="rowacts"><button class="iconbtn" data-edit="'+p.id+'">'+edit+'</button><button class="iconbtn danger" data-del="'+p.id+'">'+trash+'</button></div></td></tr>';
    }).join("");
  }
  render();

  var modal=$("#modal");
  function syncAll(){ var on=$("#fAll").checked; $("#courseList").style.opacity=on?".4":"1"; $("#courseList").style.pointerEvents=on?"none":"auto"; }
  function openModal(p){
    $("#mAlert").className="alert err";
    $("#mTitle").textContent=p?"Paketi Düzenle":"Yeni Paket";
    $("#fId").value=p?p.id:""; $("#fName").value=p?p.name:""; $("#fTag").value=p?p.tagline:"";
    $("#fPm").value=p?p.priceMonthly:""; $("#fPa").value=p?p.priceAnnualMonthly:""; $("#fAccent").value=p?p.accent:"#2C5282";
    $("#fPopular").checked=p?!!p.popular:false;
    var all=p?p.includedCourses.indexOf("all")>=0:false;
    $("#fAll").checked=all;
    $("#courseList").innerHTML=DB.courses().map(function(c){
      var on=p&&!all&&p.includedCourses.indexOf(c.id)>=0;
      return '<label style="display:flex;align-items:center;gap:9px;font-size:.9rem;cursor:pointer"><input type="checkbox" value="'+c.id+'" '+(on?'checked':'')+'> '+esc(c.title)+'</label>';
    }).join("");
    $("#fPerks").value=p?p.perks.join("\n"):"";
    syncAll();
    modal.classList.add("open");
  }
  $("#fAll").addEventListener("change",syncAll);
  $("#addBtn").addEventListener("click",function(){openModal(null)});
  modal.addEventListener("click",function(e){if(e.target.closest("[data-close]"))modal.classList.remove("open")});
  $("#saveBtn").addEventListener("click",function(){
    var name=$("#fName").value.trim();
    if(name.length<2){$("#mAlert").className="alert err show";$("#mAlert").textContent="Paket adı girin.";return;}
    var courses = $("#fAll").checked ? ["all"] : Array.prototype.slice.call($("#courseList").querySelectorAll("input:checked")).map(function(i){return i.value});
    if(!$("#fAll").checked && courses.length===0){$("#mAlert").className="alert err show";$("#mAlert").textContent="En az bir kurs seçin veya 'Tüm kurslar'ı işaretleyin.";return;}
    var perks=$("#fPerks").value.split("\n").map(function(s){return s.trim()}).filter(Boolean);
    var data={name:name,tagline:$("#fTag").value.trim(),priceMonthly:parseInt($("#fPm").value,10)||0,priceAnnualMonthly:parseInt($("#fPa").value,10)||0,popular:$("#fPopular").checked,accent:$("#fAccent").value,includedCourses:courses,perks:perks};
    if($("#fPopular").checked){ DB.packages().forEach(function(p){ if(p.id!==$("#fId").value && p.popular) DB.updatePackage(p.id,{popular:false}); }); }
    var id=$("#fId").value;
    if(id) DB.updatePackage(id,data); else DB.addPackage(data);
    modal.classList.remove("open"); render(); toast(id?"Paket güncellendi":"Paket eklendi");
  });
  $("#pBody").addEventListener("click",function(e){
    var ed=e.target.closest("[data-edit]"); if(ed){ openModal(DB.package(ed.getAttribute("data-edit"))); return; }
    var d=e.target.closest("[data-del]"); if(d){ var p=DB.package(d.getAttribute("data-del")); if(confirm('"'+p.name+'" paketi silinsin mi? (Bu pakete abone üyelerin erişimi kalkar)')){ DB.removePackage(p.id); render(); toast("Paket silindi"); } }
  });
})();
</script>
</body>
</html>
